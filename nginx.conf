server {
    listen 80;
    server_name localhost;

    # Tự động redirect nếu client gọi /users (thiếu dấu /)
    location = /users {
        return 301 /users/;
    }

    # Điều phối request tới user_service (port 8081)
    location /users/ {
        # Sử dụng DNS nội bộ của Docker: http://user_service:8081/
        # Dấu '/' ở cuối proxy_pass giúp Nginx cắt bỏ prefix '/users/' khi chuyển tiếp
        # Ví dụ: http://localhost/users/info -> http://user_service:8081/info
        proxy_pass http://user_service:8081/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tự động redirect nếu client gọi /products (thiếu dấu /)
    location = /products {
        return 301 /products/;
    }

    # Điều phối request tới product_service (port 8082)
    location /products/ {
        # Sử dụng DNS nội bộ của Docker: http://product_service:8082/
        # Dấu '/' ở cuối proxy_pass giúp Nginx cắt bỏ prefix '/products/' khi chuyển tiếp
        # Ví dụ: http://localhost/products/list -> http://product_service:8082/list
        proxy_pass http://product_service:8082/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
